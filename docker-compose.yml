version: '3.9'
services:
  checkcle:
    image: operacle/checkcle:latest
    container_name: checkcle
    restart: unless-stopped
    ports:
      - "8090:8090" # Map ports for external access, if local only "127.0.0.1:8090:8090"
    volumes:
      - /opt/pb_data:/mnt/pb_data  # Mount persistent data
      - sitespeed_results:/opt/sitespeed-results  # Performance test results
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for sitespeed.io
    environment:
      - SITESPEED_RESULTS_DIR=/opt/sitespeed-results

    # Optional: set user limits
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

volumes:
  sitespeed_results:
    driver: local